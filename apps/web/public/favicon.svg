<!-- Book icon SVG for Virtual Bookshelf PWA.
     Replace icon-192.png and icon-512.png with proper rasterised assets before launch.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#8B5E3C"/>
  <!-- Book body -->
  <rect x="14" y="12" width="28" height="36" rx="2" fill="#F5E6C8"/>
  <!-- Spine -->
  <rect x="14" y="12" width="6" height="36" rx="2" fill="#6B4423"/>
  <!-- Lines representing text -->
  <rect x="24" y="20" width="14" height="2" rx="1" fill="#C4A47C"/>
  <rect x="24" y="26" width="14" height="2" rx="1" fill="#C4A47C"/>
  <rect x="24" y="32" width="10" height="2" rx="1" fill="#C4A47C"/>
  <!-- Second book (slightly behind) -->
  <rect x="34" y="16" width="18" height="32" rx="2" fill="#D4E8D4"/>
  <rect x="34" y="16" width="5" height="32" rx="2" fill="#5A7A5A"/>
</svg>
